[project]
name = "threadly-backend"
version = "0.1.0"
description = "Threadly api container — FastAPI backend for the Threadly Gmail assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "pyyaml>=6.0",
    # Heavy SDKs — imported lazily inside functions, so tests/CI run without them installed:
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "chromadb>=0.5",
]

[project.optional-dependencies]
# CI installs ONLY core + dev (see .github/workflows/backend-ci.yml note below):
# heavy SDK imports are function-local so the app imports clean without them.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
