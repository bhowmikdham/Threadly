[project]
name = "threadly-common"
version = "0.1.0"
description = "Shared contracts for Threadly services: intents, SSE events, error envelope, draft state machine, cursors."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["threadly_common*"]
