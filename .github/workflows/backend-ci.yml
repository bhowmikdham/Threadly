name: backend-ci

on:
  pull_request:
    paths: ["backend/**", "infra/bedrock/**", "infra/deploy/ec2/**", "ml/evals/classification/**", "docs/classification/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main, release/backend]
    paths: ["backend/**", "infra/bedrock/**", "infra/deploy/ec2/**", "ml/evals/classification/**", "docs/classification/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: threadly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: threadly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadly -d threadly_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, no heavy ML deps needed for tests)
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests tools
      - name: Tests
        env:
          THREADLY_TEST_DB: postgresql+asyncpg://threadly:change-me@localhost:5432/threadly_test
          THREADLY_REQUIRE_TEST_DB: "1"
        run: python -m pytest -q
      - name: Verify versioned MVP prompt assets
        run: python -m app.workflows.mvp_assets --check --output fixtures/mvp/prompts-v1.json
      - name: Validate EC2 deployment controls offline
        run: |
          bash -n ../infra/deploy/ec2/deploy-app.sh
          python -m unittest discover -s ../infra/deploy/ec2/tests -q
      - name: Validate real Docker ingress allocation
        run: |
          docker pull caddy:2.11.4
          python ../infra/deploy/ec2/tests/smoke_ingress_allocation.py
      - name: Validate application Flow template offline
        run: |
          pip install cfn-lint==1.56.3
          python -m app.workflows.release --profile-arn 'arn:aws:bedrock:ap-southeast-2:123456789012:inference-profile/au.anthropic.claude-haiku-4-5-20251001-v1:0' --output "$RUNNER_TEMP/threadly-runtime-flow"
          cfn-lint -t "$RUNNER_TEMP/threadly-runtime-flow/stack.json"
          python -m app.workflows.release --auxiliary --profile-arn 'arn:aws:bedrock:ap-southeast-2:123456789012:inference-profile/au.anthropic.claude-haiku-4-5-20251001-v1:0' --output "$RUNNER_TEMP/threadly-auxiliary-flow"
          cfn-lint -t "$RUNNER_TEMP/threadly-auxiliary-flow/stack.json"
      - name: Validate summary console experiment offline
        run: |
          python -m unittest discover -s ../infra/bedrock/tests -q
          mkdir -p "$RUNNER_TEMP/threadly-summary-console"
          cd "$RUNNER_TEMP/threadly-summary-console"
          python "$GITHUB_WORKSPACE/infra/bedrock/cloudshell_summary.py" --render-only
          cfn-lint -t threadly-summary-*/template.json
      - name: Validate classification provisioning and Haiku assets
        run: |
          PYTHONPATH=. python -m pytest -q ../infra/bedrock/tests
          python ../infra/bedrock/classification_flows.py --render-only --output "$RUNNER_TEMP/threadly-classification"
          cfn-lint -t "$RUNNER_TEMP/threadly-classification/template.json"
