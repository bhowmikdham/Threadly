name: Prepare or submit store release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit to the configured store listing (requires publisher setup)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLASMO_PUBLIC_THREADLY_BACKEND_ORIGIN: https://api.threadly.au
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: threadly-store-package
          path: build/chrome-mv3-prod.zip
          retention-days: 30
      - name: Publish the manually requested store build
        if: ${{ inputs.publish }}
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
