name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: threadly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: threadly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadly -d threadly_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, no heavy ML deps needed for tests)
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests
        env:
          THREADLY_TEST_DB: postgresql+asyncpg://threadly:change-me@localhost:5432/threadly_test
          THREADLY_REQUIRE_TEST_DB: "1"
        run: python -m pytest -q
      - name: Validate application Flow template offline
        run: |
          pip install cfn-lint==1.56.3
          python -m app.workflows.release --profile-arn 'arn:aws:bedrock:ap-southeast-2:123456789012:inference-profile/au.anthropic.claude-haiku-4-5-20251001-v1:0' --output "$RUNNER_TEMP/threadly-runtime-flow"
          cfn-lint -t "$RUNNER_TEMP/threadly-runtime-flow/stack.json"
