name: Frontend integration checks
on:
  pull_request:
    branches: [frontend]
  push:
    branches: [frontend, codex/frontend-backend-integration]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build
        env:
          PLASMO_PUBLIC_THREADLY_BACKEND_ORIGIN: https://api.example.test
      - run: npx playwright test tests/e2e/public-origin.spec.ts
        env:
          PLASMO_PUBLIC_THREADLY_BACKEND_ORIGIN: https://api.example.test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: threadly-chrome-extension
          path: build/chrome-mv3-prod
          retention-days: 7
