name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pydantic pytest
      - name: Syntax check
        run: python -m compileall -q libs services tests
      - name: Unit tests
        run: pytest tests/ -q
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for services
        run: docker compose exec -T gateway python - < tests/e2e/wait.py
      - name: Run E2E smoke suite
        run: docker compose exec -T gateway python - < tests/e2e/smoke.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
