[project]
name = "threadly-backend"
version = "0.1.0"
description = "Threadly api container — FastAPI backend for the Threadly Gmail assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "pyyaml>=6.0",
    "tzdata>=2025.2",  # IANA fallback when a host/container has no system zone database
    "boto3>=1.35",  # lazy-loaded Bedrock Runtime adapter; AWS credential chain
    # Google OAuth + Gmail are called over plain REST with httpx (app/auth/google.py,
    # app/sync/gmail.py) — no google SDKs in the image, fully mockable in tests.
    # chromadb is imported lazily (W3), so tests/CI run without it installed:
    "chromadb>=0.5",
]

[project.optional-dependencies]
# CI installs ONLY core + dev (see .github/workflows/backend-ci.yml note below):
# heavy SDK imports are function-local so the app imports clean without them.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "jsonschema>=4",  # validate generated artifacts against the shared contract
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
